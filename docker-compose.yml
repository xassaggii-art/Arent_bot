services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: arent_flaresolverr
    restart: unless-stopped
    ports:
      - "8191:8191"
    environment:
      LOG_LEVEL: info
      TZ: Asia/Yerevan

  bot:
    build: .
    container_name: arent_bot
    restart: unless-stopped
    depends_on:
      - flaresolverr
    env_file:
      - .env
    environment:
      FLARESOLVERR_URL: http://flaresolverr:8191
      DATABASE_PATH: /app/data/bot.sqlite3
    volumes:
      - ./data:/app/data
